services:
  # 1. BASE DE DATOS
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. BROKER DE MENSAJES (Redis)
  redis:
    image: redis:7-alpine
    container_name: redis_container
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # 3. BACKEND (FastAPI)
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: fastapi_container
    restart: always
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres_db
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # 4. CELERY WORKER
  celery_worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: celery_worker_container
    restart: always
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres_db
      - redis
    command: celery -A ${CELERY_APP_MODULE:-worker.celery_app} worker --loglevel=${CELERY_LOG_LEVEL:-info}

  # 5. FRONTEND (Vue + Nginx)
  nginx:
    image: nginx:alpine
    container_name: nginx_frontend_container
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data: