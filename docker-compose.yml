services:
  # 1. BASE DE DATOS
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. BROKER DE MENSAJES (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_container
    restart: always
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"   # Puerto principal de comunicación para Celery
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672" # Puerto para el Panel Web de administración
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. REDIS (Broker de eventos en tiempo real)
  redis:
    image: redis:7-alpine
    container_name: redis_container
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. BACKEND (FastAPI)
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: fastapi_container
    restart: always
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./.cache/languagetool:/root/.cache/language-tool-python
    depends_on:
      postgres_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # 5.A. WORKER EXCLUSIVO PARA IA (Secuencial y estricto)
  worker_ai:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: worker_ai_container
    restart: always
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./backend:/app
      - ./.cache/languagetool:/root/.cache/language-tool-python
    depends_on:
      postgres_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    command: celery -A ${CELERY_APP_MODULE} worker -Q ai_queue -c 1 --loglevel=${CELERY_LOG_LEVEL}

  # 5.B. WORKER PARA TAREAS GENERALES EN SEGUNDO PLANO
  worker_background:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: worker_background_container
    restart: always
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./backend:/app
      - ./.cache/languagetool:/root/.cache/language-tool-python
    depends_on:
      postgres_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    command: celery -A ${CELERY_APP_MODULE} worker -Q background_queue -c 2 --loglevel=${CELERY_LOG_LEVEL}

  # 6. FRONTEND (Vue + Nginx)
  nginx:
    image: nginx:alpine
    container_name: nginx_frontend_container
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  # 7. LOGGING SERVICE - Custom endpoint para recibir logs
  logging_service:
    build:
      context: ./logging_service
      dockerfile: Dockerfile
    container_name: logging_service_container
    restart: always
    ports:
      - "${LOGGING_SERVICE_PORT:-8001}:8000"
    volumes:
      - ./logs:/app/logs
    environment:
      - LOG_DIR=/app/logs

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
