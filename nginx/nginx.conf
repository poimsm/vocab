# HTTP - Redirigir a HTTPS y validación SSL
server {
    listen 80;
    server_name strawmist.com www.strawmist.com;

    # Validación de certificado SSL (debe estar en HTTP)
    location /.well-known/pki-validation/ {
        alias /usr/share/nginx/pki-validation/;
        access_log off;
    }

    # Redirigir todo lo demás a HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name strawmist.com www.strawmist.com;

    # Certificados SSL
    ssl_certificate /etc/nginx/ssl/strawmist_com.crt;
    ssl_certificate_key /etc/nginx/ssl/strawmist.key;
    ssl_trusted_certificate /etc/nginx/ssl/strawmist_com.ca-bundle;

    # Configuración SSL recomendada
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Cache para assets con hash (index-*.js, index-*.css)
        location ~* \.(js|css)$ {
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # No cachear index.html
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Archivos estáticos (media)
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy inverso para no lidiar con IPs ni puertos en el código de Vue
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
}