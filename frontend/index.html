<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vocab - Learn vocabulary efficiently">
    <meta name="theme-color" content="#2d2a3e">

    <!-- Preconnect to API & external services -->
    <link rel="preconnect" href="/api" crossorigin>
    <link rel="dns-prefetch" href="/api">

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico">

    <!-- Title -->
    <title>Vocab - Vocabulary Learning</title>

    <!-- Loading splash screen styles -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #2d2a3e;
        color: #e2e0e8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      .loading-splash {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        background-color: #2d2a3e;
      }

      .loading-spinner {
        display: inline-block;
        width: 40px;
        height: 40px;
        border: 4px solid rgba(226, 224, 232, 0.2);
        border-top-color: #a78bfa;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-text {
        margin-top: 16px;
        font-size: 14px;
        color: #9c99ab;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      /* Hide splash after app loads */
      #app:not(:empty) ~ .loading-splash {
        display: none;
      }
    </style>

  </head>
  <body>
    <div id="app"></div>
    <div class="loading-splash">
      <div>
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading app...</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
